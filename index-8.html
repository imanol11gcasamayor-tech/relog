<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mando">
<title>Mando</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#cfd3ff;font:16px system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#setup{padding:calc(env(safe-area-inset-top,0px) + 24px) 22px 20px;max-width:430px;margin:0 auto}
h2{margin:0 0 6px;font-size:24px}
p{color:#8e93bd;line-height:1.5}
label{display:block;margin:16px 0 6px;font-weight:600;color:#e8ebff}
input[type=text]{width:100%;box-sizing:border-box;padding:13px;font-size:22px;letter-spacing:.4em;text-align:center;background:#12142a;color:#fff;border:1px solid #333a66;border-radius:10px}
.chk{display:flex;gap:10px;align-items:center;font-weight:400}
button{width:100%;padding:15px;font:700 18px system-ui;border:0;border-radius:12px;background:#f0c866;color:#111;margin-top:14px}
button.alt{background:#232749;color:#e8ebff}
#msg{color:#9fe3a8;margin-top:10px;min-height:22px}
#stage{display:none;position:fixed;inset:0;background:#000}
.box{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;background-size:100% 100%}
#lock{will-change:transform}
.dot{position:absolute;width:3.22%;aspect-ratio:1;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .15s}
.dot.on{transform:translate(-50%,-50%) scale(1)}
.kp{position:absolute;width:19.5%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%);opacity:0}
.kp.go{animation:kp .4s ease-out}
@keyframes kp{0%{opacity:.6}100%{opacity:0}}
#ov{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;background:#000;transition:opacity .45s;pointer-events:none}
#fl{position:fixed;inset:0;background:#fff;display:none;pointer-events:none}
</style>
</head>
<body>
<div id="setup">
  <h2>Mando de reloj</h2>
  <p>Con «Reproduciendo» del reloj: <b>⏯</b> enciende o apaga el móvil falso, <b>⏭</b> teclea el siguiente número del código, <b>⏮</b> hace un efecto de linterna.</p>
  <label>Código que se «teclea solo» (4 cifras)</label>
  <input type="text" id="code" inputmode="numeric" maxlength="4" value="1234">
  <label class="chk"><input type="checkbox" id="usetorch"> Usar la linterna real (abre la cámara trasera)</label>
  <button class="alt" id="ttest">Probar linterna</button>
  <button id="go">Activar</button>
  <div id="msg"></div>
  <p style="font-size:14px">Con la pantalla activa, mantén 2 segundos pulsada la esquina superior izquierda para volver aquí.</p>
</div>
<div id="stage">
  <div class="box" id="home"></div>
  <div class="box" id="lock"></div>
  <div id="fl"></div>
  <div id="ov"></div>
</div>

  if(!ok){$('msg').textContent='No se pudo abrir la cámara. Concede el permiso.';return;}
  seq([[1,500],[0,400],[1,500],[0,300]]);
  $('msg').textContent='¿Se ha encendido la linterna? Si no, se usará la pantalla blanca.';
};

// ---- móvil falso ----
function wake(){
  idx=0;busy=false;dots.forEach(function(d){d.classList.remove('on');});
  $('lock').style.transition='none';$('lock').style.transform='none';
  $('ov').style.opacity=0;st='lock';meta('Encendido');
}
function sleep(){$('ov').style.opacity=1;st='off';meta('Apagado');}
function press(){
  if(st!=='lock'||busy)return;
  var d=code.charAt(idx),e=kps[d];
  e.classList.remove('go');void e.offsetWidth;e.classList.add('go');
  dots[idx].classList.add('on');idx++;meta('Código '+idx+'/4');
  if(idx>=4){busy=true;setTimeout(function(){
    $('lock').style.transition='transform .6s cubic-bezier(.5,0,.8,.4)';$('lock').style.transform='translateY(-105%)';
    st='home';busy=false;meta('Desbloqueado');},550);}
}
function cmd(x){
  if(x==='play'||x==='pause'){if(st==='off')wake();else sleep();}
  else if(x==='nexttrack')press();
  else if(x==='previoustrack'){seq(PAT[pat%PAT.length]);pat++;meta('Linterna '+pat);}
}

// ---- activar ----
$('go').onclick=async function(){
  var c=($('code').value||'').replace(/\D/g,'');
  if(c.length!==4){$('msg').textContent='El código debe tener 4 cifras.';return;}
  code=c;
  try{localStorage.setItem('mando2',JSON.stringify({code:c,torch:$('usetorch').checked}));}catch(e){}
  au.src=wav();au.loop=true;
  try{await au.play();}catch(e){$('msg').textContent='No pude iniciar el audio.';return;}
  if($('usetorch').checked)await torchInit();
  var ms=navigator.mediaSession;
  if(ms){meta('Mando listo');ms.playbackState='playing';
    ['play','pause','previoustrack','nexttrack'].forEach(function(x){try{ms.setActionHandler(x,function(){cmd(x);ms.playbackState='playing';});}catch(e){}});}
  try{navigator.wakeLock.request('screen');}catch(e){}
  $('setup').style.display='none';$('stage').style.display='block';
  $('ov').style.transition='none';$('ov').style.opacity=1;setTimeout(function(){$('ov').style.transition='opacity .45s';},60);
  st='off';
};
// volver a la configuración: mantener 2 s la esquina superior izquierda
var ht=null;
$('stage').addEventListener('pointerdown',function(e){
  if(e.clientX<90&&e.clientY<90)ht=setTimeout(function(){$('stage').style.display='none';$('setup').style.display='block';},2000);
});
['pointerup','pointercancel'].forEach(function(n){$('stage').addEventListener(n,function(){clearTimeout(ht);});});
</script>
